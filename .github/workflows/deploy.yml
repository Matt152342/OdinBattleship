name: Build and Deploy Battleship

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is named master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run tests (if you have Jest set up)
      - name: Run Tests
        run: npm test -- --passWithNoTests

      # 5. Build Webpack production bundle
      - name: Build Webpack
        run: npm run build

      # 6. Deploy 'dist' folder to gh-pages branch
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Deploys contents of the Webpack build directory
          branch: gh-pages