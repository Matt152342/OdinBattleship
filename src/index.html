<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Battleship</title>
    </head>

    <body>
        <div class="header">
            <div class="title">Battleship</div>
        </div>

        <div class="main">
            <!-- Start Menu -->
            <div id="startMenu" class="screen">
                <button class="onePlayerBtn startBtn">One Player</button>
                <button class="twoPlayerBtn startBtn">Two Player</button>
            </div>

            <!-- Game Menu -->
            <div id="gameMenu" class="screen hidden">
                <div class="boardContainer">
                    <div class="playerOneBlock">
                        <h2>Player One's Board</h2>
                    </div>
                    <div class="playerTwoBlock">
                        <h2>Player Two's Board</h2>
                    </div>
                </div>

                <div id="setupControls">
                    <h2 id="shipInfo">Place your Ship</h2>
                    <div class="setupBtns">
                        <button id="rotateBtn">Axis: Horizontal</button>
                        <button id="startBtn" disabled>Ready</button>
                    </div>
                </div>
            </div>

            <div id="bufferMenu" class="screen hidden"></div>

            <!-- End Menu -->
            <div id="endMenu" class="screen hidden">
                <div class="endMessage"></div>
            </div>
        </div>

        <div class="footer">
            <button class="homeBtn">Home</button>
            <div class="Author">Made by Matthew van Heerden - 2026</div>
        </div>
    </body>
</html>
